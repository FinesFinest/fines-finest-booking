name: Pruefen

# Bei jedem Push und Pull Request: Syntax fuer die unterstuetzten PHP-Versionen,
# die Tests der Slot-Berechnung und der Plugin Check von wordpress.org.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  syntax:
    name: php -l mit PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax pruefen
        run: |
          for f in $(find . -name '*.php' -not -path './.git/*' -not -path './tests/*'); do
            php -l "$f" >/dev/null || exit 1
          done
          echo "php -l ohne Fehler"

  tests:
    name: PHPUnit mit PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpunit:11
      - name: Tests
        run: phpunit --testdox

  plugin-check:
    name: Plugin Check (Fassung fuer wordpress.org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fassung ohne GitHub-Updater bauen
        run: |
          # Wie im Release-Workflow: ohne Updater und ohne Update-URI, so wie das Plugin bei wordpress.org laege.
          rm -rf build/wporg && mkdir -p build/wporg
          git archive --format=tar --prefix=fines-finest-booking/ HEAD | tar -x -C build/wporg
          rm build/wporg/fines-finest-booking/includes/class-ffb-updater.php
          sed -i '/^ \* Update URI:/d' build/wporg/fines-finest-booking/fines-finest-booking.php
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/wporg/fines-finest-booking
          ignore-warnings: true
