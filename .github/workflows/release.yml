name: Release-ZIP bauen

# Laeuft bei jedem Tag der Form v1.2.0: prueft, dass der Tag zur Plugin-Version passt,
# packt das Plugin in einen Ordner "fines-finest-booking" und haengt das ZIP an ein
# GitHub-Release. Die WordPress-Installationen holen sich genau dieses ZIP.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag gegen Plugin-Version pruefen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^ \* Version:' fines-finest-booking.php | awk '{print $3}')
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $3}')
          echo "Tag: $TAG, Plugin-Kopf: $HEADER, readme: $STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$STABLE" ]; then
            echo "Versionen passen nicht zusammen. Abbruch."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpunit:11

      - name: Syntax pruefen
        run: |
          for f in $(find . -name '*.php' -not -path './.git/*'); do php -l "$f" >/dev/null || exit 1; done
          echo "php -l ohne Fehler"

      - name: Tests
        run: phpunit --testdox

      - name: ZIP bauen
        run: |
          # git archive beachtet die export-ignore-Regeln aus .gitattributes, genau wie das lokale Paket.
          mkdir -p build
          git archive --format=zip --prefix=fines-finest-booking/ -o build/fines-finest-booking.zip "$GITHUB_REF_NAME"
          unzip -l build/fines-finest-booking.zip | head -15

      - name: ZIP fuer das WordPress-Verzeichnis bauen
        run: |
          # Gleicher Stand ohne GitHub-Updater und ohne Update-URI: wordpress.org erlaubt beides nicht
          # und liefert Updates selbst aus. Dieses ZIP ist nur fuer die Einreichung dort gedacht.
          rm -rf build/wporg && mkdir -p build/wporg
          git archive --format=tar --prefix=fines-finest-booking/ "$GITHUB_REF_NAME" | tar -x -C build/wporg
          rm build/wporg/fines-finest-booking/includes/class-ffb-updater.php
          # Keine Sprachdateien im Verzeichnis-Paket: Dort liefert translate.wordpress.org die Sprachpakete.
          rm -rf build/wporg/fines-finest-booking/languages
          sed -i '/^ \* Update URI:/d' build/wporg/fines-finest-booking/fines-finest-booking.php
          # Ohne Sprachordner darf der Header Domain Path nicht mehr auf ihn zeigen.
          sed -i '/^ \* Domain Path:/d' build/wporg/fines-finest-booking/fines-finest-booking.php
          if grep -q 'Update URI' build/wporg/fines-finest-booking/fines-finest-booking.php; then
            echo "Update-URI steht noch im Plugin-Kopf. Abbruch."
            exit 1
          fi
          (cd build/wporg && zip -qr ../fines-finest-booking-wporg.zip fines-finest-booking)
          unzip -l build/fines-finest-booking-wporg.zip | head -15

      - name: Changelog aus readme.txt auslesen
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 == "= " v " =" { f = 1; next } f && /^= / { exit } f' readme.txt > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Keine Changelog-Eintraege fuer $V in readme.txt gefunden." > release-notes.md
          fi
          cat release-notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wird ein Tag neu gesetzt, ersetzt das neue Release das alte statt zu scheitern.
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" build/fines-finest-booking.zip build/fines-finest-booking-wporg.zip \
            --title "Version ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
